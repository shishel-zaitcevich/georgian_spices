    <div id="root"></div>

    <!-- React Fast Refresh Preamble (обязательно для HMR в Vite + React) -->

      import RefreshRuntime from 'http://localhost:5173/@react-refresh';

      window.$RefreshSig$ = () => (type) => type;

    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
